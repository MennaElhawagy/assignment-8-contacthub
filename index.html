<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContactHub - Smart Contact Manager</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='25' r='9' fill='white'/%3E%3Cpath d='M16 48c2-9 9-13 16-13s14 4 16 13' fill='white'/%3E%3C/svg%3E"
    />

    <!-- Fonts & icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Soft background blobs -->
    <div class="bg-blobs" aria-hidden="true">
      <span class="blob blob-blue"></span>
      <span class="blob blob-violet"></span>
      <span class="blob blob-emerald"></span>
    </div>

    <!-- ================= Header ================= -->
    <header class="app-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="brand-logo"><i class="fa-solid fa-address-book"></i></span>
          <div>
            <h1 class="brand-name">Contact<span>Hub</span></h1>
            <p class="brand-tagline">Smart Contact Manager</p>
          </div>
        </div>

        <div class="header-actions">
          <button type="button" id="addContactBtn" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i>
            <span class="label-long">Add Contact</span>
            <span class="label-short">Add</span>
          </button>
          <button type="button" class="icon-btn hide-mobile" title="Notifications" aria-label="Notifications">
            <i class="fa-solid fa-bell"></i>
          </button>
          <button type="button" class="icon-btn hide-mobile" title="Settings" aria-label="Settings">
            <i class="fa-solid fa-gear"></i>
          </button>
          <span class="profile-avatar" title="Profile"><i class="fa-solid fa-user"></i></span>
        </div>
      </div>
    </header>

    <!-- ================= Main ================= -->
    <main class="container main">
      <!-- Stats -->
      <section class="stats" aria-label="Contact statistics">
        <div class="stat-card">
          <span class="stat-icon icon-blue"><i class="fa-solid fa-users"></i></span>
          <div>
            <p class="stat-label">Total</p>
            <p class="stat-value" id="totalCount">0</p>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon icon-amber"><i class="fa-solid fa-star"></i></span>
          <div>
            <p class="stat-label">Favorites</p>
            <p class="stat-value" id="favoritesCount">0</p>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon icon-rose"><i class="fa-solid fa-heart-pulse"></i></span>
          <div>
            <p class="stat-label">Emergency</p>
            <p class="stat-value" id="emergencyCount">0</p>
          </div>
        </div>
      </section>

      <div class="layout">
        <!-- Contacts -->
        <div class="content">
          <section class="contacts-header">
            <h2>All Contacts</h2>
            <p id="contactsSubtitle">Manage your personal and professional connections</p>
          </section>

          <div class="search">
            <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
            <input
              type="search"
              id="searchInput"
              placeholder="Search by name, phone, or email..."
              aria-label="Search contacts"
              autocomplete="off"
            />
          </div>

          <section id="contactsGrid" class="contacts-grid" aria-live="polite">
            <!-- Rendered by js/main.js -->
          </section>
        </div>

        <!-- Sidebar: favorites & emergency -->
        <aside class="sidebar">
          <section class="panel panel-favorites">
            <div class="panel-header">
              <span class="panel-icon icon-amber"><i class="fa-solid fa-star"></i></span>
              <div>
                <h2>Favorites</h2>
                <p>Quick access to starred contacts</p>
              </div>
            </div>
            <div id="favoritesList" class="quick-list">
              <!-- Rendered by js/main.js -->
            </div>
          </section>

          <section class="panel panel-emergency">
            <div class="panel-header">
              <span class="panel-icon icon-rose"><i class="fa-solid fa-heart-pulse"></i></span>
              <div>
                <h2>Emergency</h2>
                <p>Important contacts for urgent calls</p>
              </div>
            </div>
            <div id="emergencyList" class="quick-list">
              <!-- Rendered by js/main.js -->
            </div>
          </section>
        </aside>
      </div>
    </main>

    <!-- ================= Add / Edit modal ================= -->
    <div id="contactModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>

      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle">Add New Contact</h2>
          <button type="button" class="icon-btn" data-close-modal title="Close" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <form id="contactForm" class="modal-body" novalidate>
          <!-- Photo -->
          <div class="photo-picker">
            <div id="avatarPreview" class="avatar-preview">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="photo-actions">
              <label class="btn btn-soft">
                <i class="fa-solid fa-camera"></i>
                <span>Change Photo</span>
                <input type="file" id="avatarInput" accept="image/*" hidden />
              </label>
              <button type="button" id="removePhotoBtn" class="btn btn-link" hidden>Remove</button>
            </div>
          </div>

          <div class="field">
            <label for="contactName">Full Name <span class="required">*</span></label>
            <input type="text" id="contactName" placeholder="Enter full name" maxlength="50" autocomplete="off" />
            <p id="contactNameError" class="field-error" hidden></p>
          </div>

          <div class="field">
            <label for="contactPhone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="contactPhone" placeholder="e.g., 01012345678" autocomplete="off" />
            <p id="contactPhoneError" class="field-error" hidden></p>
          </div>

          <div class="field">
            <label for="contactEmail">Email Address</label>
            <input type="email" id="contactEmail" placeholder="name@example.com" autocomplete="off" />
            <p id="contactEmailError" class="field-error" hidden></p>
          </div>

          <div class="field">
            <label for="contactAddress">Address</label>
            <input type="text" id="contactAddress" placeholder="Enter address" autocomplete="off" />
          </div>

          <div class="field">
            <label for="contactGroup">Group</label>
            <select id="contactGroup">
              <option value="">Select a group</option>
              <option value="family">Family</option>
              <option value="friends">Friends</option>
              <option value="work">Work</option>
              <option value="school">School</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="contactNotes">Notes</label>
            <textarea id="contactNotes" rows="2" placeholder="Add notes about this contact"></textarea>
          </div>

          <div class="checks">
            <label class="check check-favorite">
              <input type="checkbox" id="contactFavorite" />
              <span><i class="fa-solid fa-star"></i>Favorite</span>
            </label>
            <label class="check check-emergency">
              <input type="checkbox" id="contactEmergency" />
              <span><i class="fa-solid fa-heart-pulse"></i>Emergency</span>
            </label>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-check"></i>
              <span id="submitLabel">Save Contact</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
